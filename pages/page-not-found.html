<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="error-illustration">
            <svg class="wavy-line" viewBox="0 0 300 600" fill="none">
                <path class="line-path" d="M50 0 Q150 100 50 200 Q-50 300 50 400 Q150 500 50 600" stroke="#333" stroke-width="3" fill="none"/>
                <circle class="floating-circle circle-1" cx="80" cy="150" r="15"/>
                <circle class="floating-circle circle-2" cx="30" cy="450" r="12"/>
            </svg>
            
            <div class="broken-link">
                <div class="link-segment segment-1"></div>
                <div class="link-segment segment-2"></div>
                <div class="sparks">
                    <div class="spark spark-1"></div>
                    <div class="spark spark-2"></div>
                    <div class="spark spark-3"></div>
                    <div class="spark spark-4"></div>
                </div>
            </div>
        </div>
        
        <div class="content">
            <div class="error-code">
                <span class="four">4</span>
                <span class="zero">0</span>
                <span class="four">4</span>
                <span class="dot">°</span>
            </div>
            
            <h1 class="error-title">Page Not Found</h1>
            
            <p class="error-message">
                we're sorry. the page you requested could no be found<br>
                Please go back to the home page
            </p>
            
            <button class="home-btn" id="homeBtn">
                Learn More About Us →
            </button>
        </div>
        
        <div class="decorative-elements">
            <div class="cross cross-1">×</div>
            <div class="cross cross-2">×</div>
            <div class="circle circle-large"></div>
            <div class="circle circle-small"></div>
        </div>
    </div>
    
    <script src="js/script.js"></script>
</body>
</html>
